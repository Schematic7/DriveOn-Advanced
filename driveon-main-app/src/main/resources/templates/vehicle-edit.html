<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Vehicle - DriveOn Motors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --bg: #08090c;
            --surface: #12141b;
            --surface-2: #171a23;
            --line: rgba(255, 255, 255, .08);
            --line-strong: rgba(255, 255, 255, .16);
            --txt: #eef1f6;
            --muted: #8b93a4;
            --brand: #e63946;
            --brand-2: #d90429;
            --radius: 18px;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            background-image: radial-gradient(900px 500px at 12% -10%, rgba(230, 57, 70, .16), transparent 60%),
            radial-gradient(800px 480px at 92% 4%, rgba(217, 4, 41, .10), transparent 60%);
            background-attachment: fixed;
            color: var(--txt);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-drive {
            background: rgba(8, 9, 12, .72);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--line);
            padding: .9rem 0;
        }

        .navbar-drive .navbar-brand {
            font-weight: 900;
            letter-spacing: .22em;
            font-size: 1.35rem;
            color: #fff !important;
            background: linear-gradient(90deg, #fff 40%, var(--brand));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar-drive .nav-link {
            color: var(--muted) !important;
            font-weight: 600;
            font-size: .86rem;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: .5rem .9rem !important;
            border-radius: 999px;
            transition: .22s ease;
        }

        .navbar-drive .nav-link:hover {
            color: #fff !important;
            background: rgba(255, 255, 255, .06);
        }

        .navbar-toggler-icon {
            filter: invert(1) grayscale(1);
        }

        .brand-highlight {
            color: var(--brand);
        }

        .btn-ghost-warning {
            border: 1px solid rgba(255, 193, 7, 0.4);
            color: #ffc107;
            background: rgba(255, 193, 7, 0.05);
            font-weight: 700;
            border-radius: 999px !important;
            transition: .22s ease;
        }

        .btn-ghost-warning:hover {
            background: rgba(255, 193, 7, 0.15);
            color: #fff;
            border-color: #ffc107;
        }

        .btn-ghost-danger {
            border: 1px solid rgba(230, 57, 70, 0.4);
            color: #e63946;
            background: rgba(230, 57, 70, 0.05);
            font-weight: 700;
            border-radius: 999px !important;
            transition: .22s ease;
        }

        .btn-ghost-danger:hover {
            background: rgba(230, 57, 70, 0.15);
            color: #fff;
            border-color: #e63946;
        }

        .form-card {
            background: linear-gradient(180deg, var(--surface-2), var(--surface));
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: 0 30px 60px -35px rgba(0, 0, 0, .9);
            overflow: hidden;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .form-header {
            background: rgba(255, 255, 255, .02);
            color: #ffffff;
            padding: 25px 30px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
        }

        .form-header h4 {
            margin: 0;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.2rem;
        }

        .form-header i {
            color: var(--brand);
        }

        .form-body {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #6c757d;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            background-color: #2b2d42;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus:not([readonly]) {
            background-color: #35394a;
            border-color: var(--brand);
            outline: none;
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.2);
        }

        input[readonly] {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--muted);
            border: 1px dashed var(--line-strong);
            cursor: not-allowed;
        }

        input[readonly]:focus {
            box-shadow: none;
            border-color: var(--line-strong);
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        .error-message {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 8px;
            display: block;
            font-weight: 600;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            color: white;
            border: none;
            border-radius: 999px;
            padding: 14px 30px;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 12px 30px -12px rgba(230, 57, 70, .8);
        }

        .btn-submit:hover {
            background-color: #d90429;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 18px 40px -14px rgba(230, 57, 70, .95);
        }

        .btn-cancel {
            background-color: rgba(255, 255, 255, .03);
            color: var(--txt);
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            padding: 14px 30px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.22s ease;
            text-decoration: none;
            display: inline-block;
            width: 100%;
            text-align: center;
            margin-top: 10px;
        }

        .btn-cancel:hover {
            background-color: rgba(255, 255, 255, .09);
            color: #ffffff;
            border-color: rgba(255, 255, 255, .3);
        }

    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-drive sticky-top">
    <div class="container-fluid px-4 px-lg-5">
        <a class="navbar-brand" th:href="@{/}">DRIVEON</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMainLogged">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMainLogged">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/users/profile}">
                        <i class="fa-solid fa-user me-1 text-warning"></i>
                        <span class="fw-bold" sec:authentication="name">User</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        <i class="fa-solid fa-warehouse me-1 brand-highlight"></i> My Garage
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/appointments/add}">
                        <i class="fa-solid fa-calendar-plus me-1 brand-highlight"></i> Book Service
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/vehicles/add}">
                        <i class="fa-solid fa-car me-1 brand-highlight"></i> Add Vehicle
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="btn btn-ghost-warning btn-sm px-3 py-2 mx-2" th:href="@{/admin/appointments}">
                        <i class="fa-solid fa-shield-halved me-1"></i> Admin
                    </a>
                </li>
                <li class="nav-item ms-lg-2">
                    <form th:action="@{/users/logout}" th:method="POST" class="m-0">
                        <button type="submit" class="btn btn-ghost-danger btn-sm px-3 py-2">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container flex-grow-1 d-flex justify-content-center align-items-center">
    <div class="col-12 col-lg-8 col-xl-7">

        <div class="form-card">
            <div class="form-header">
                <i class="fa-solid fa-pen-to-square fa-2x me-3 opacity-75"></i>
                <h4>Edit Vehicle Details</h4>
            </div>

            <div class="form-body">
                <form th:action="@{/vehicles/{id}/edit(id=${vehicleEditDTO.id})}" th:method="POST"
                      th:object="${vehicleEditDTO}">

                    <input type="hidden" th:field="*{id}"/>

                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="make">Make</label>
                            <input type="text" id="make" th:field="*{make}"/>
                            <span th:if="${#fields.hasErrors('make')}" th:errors="*{make}" class="error-message">Make Error</span>
                        </div>

                        <div class="col-md-6 form-group">
                            <label for="model">Model</label>
                            <input type="text" id="model" th:field="*{model}"/>
                            <span th:if="${#fields.hasErrors('model')}" th:errors="*{model}" class="error-message">Model Error</span>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="year">Year</label>
                            <input type="number" id="year" th:field="*{year}"/>
                            <span th:if="${#fields.hasErrors('year')}" th:errors="*{year}" class="error-message">Year Error</span>
                        </div>

                        <div class="col-md-6 form-group">
                            <label for="licensePlate">License Plate</label>
                            <input type="text" id="licensePlate" th:field="*{licensePlate}"/>
                            <span th:if="${#fields.hasErrors('licensePlate')}" th:errors="*{licensePlate}"
                                  class="error-message">Plate Error</span>
                        </div>
                    </div>

                    <div class="form-group mb-4">
                        <label for="vin"><i class="fa-solid fa-lock me-1"></i> VIN Number</label>
                        <input type="text" id="vin" th:field="*{vin}" readonly class="font-monospace text-uppercase"/>
                    </div>

                    <div class="row mt-4">
                        <div class="col-md-4">
                            <a th:href="@{/}" class="btn-cancel"><i class="fa-solid fa-arrow-left me-2"></i> Cancel</a>
                        </div>
                        <div class="col-md-8">
                            <button type="submit" class="btn-submit"><i class="fa-solid fa-floppy-disk me-2"></i> Save
                                Changes
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
