<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - DriveOn Motors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --bg: #08090c;
            --surface: #12141b;
            --surface-2: #171a23;
            --line: rgba(255, 255, 255, .08);
            --line-strong: rgba(255, 255, 255, .16);
            --txt: #eef1f6;
            --muted: #8b93a4;
            --brand: #e63946;
            --brand-2: #d90429;
            --radius: 18px;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            background-image: radial-gradient(900px 500px at 12% -10%, rgba(230, 57, 70, .16), transparent 60%),
            radial-gradient(800px 480px at 92% 4%, rgba(217, 4, 41, .10), transparent 60%);
            background-attachment: fixed;
            color: var(--txt);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-drive {
            background: rgba(8, 9, 12, .72);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--line);
            padding: .9rem 0;
        }

        .navbar-drive .navbar-brand {
            font-weight: 900;
            letter-spacing: .22em;
            font-size: 1.35rem;
            color: #fff !important;
            background: linear-gradient(90deg, #fff 40%, var(--brand));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar-drive .nav-link {
            color: var(--muted) !important;
            font-weight: 600;
            font-size: .86rem;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: .5rem .9rem !important;
            border-radius: 999px;
            transition: .22s ease;
        }

        .navbar-drive .nav-link:hover {
            color: #fff !important;
            background: rgba(255, 255, 255, .06);
        }

        .navbar-toggler-icon {
            filter: invert(1) grayscale(1);
        }

        .brand-highlight {
            color: var(--brand);
        }

        .btn-ghost-warning {
            border: 1px solid rgba(255, 193, 7, 0.4);
            color: #ffc107;
            background: rgba(255, 193, 7, 0.05);
            font-weight: 700;
            border-radius: 999px !important;
            transition: .22s ease;
        }

        .btn-ghost-warning:hover {
            background: rgba(255, 193, 7, 0.15);
            color: #fff;
            border-color: #ffc107;
        }

        .btn-ghost-danger {
            border: 1px solid rgba(230, 57, 70, 0.4);
            color: #e63946;
            background: rgba(230, 57, 70, 0.05);
            font-weight: 700;
            border-radius: 999px !important;
            transition: .22s ease;
        }

        .btn-ghost-danger:hover {
            background: rgba(230, 57, 70, 0.15);
            color: #fff;
            border-color: #e63946;
        }

        .panel {
            background: linear-gradient(180deg, var(--surface-2), var(--surface));
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 30px 60px -35px rgba(0, 0, 0, .9);
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            padding: 1.15rem 1.5rem;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, .02);
        }

        .panel-head h2 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: .8rem;
        }

        .panel-head h2 i {
            color: #ffc107;
        }

        .table-drive {
            margin: 0;
            color: var(--txt);
            --bs-table-bg: transparent;
        }

        .table-drive thead th {
            color: var(--muted);
            font-size: .68rem;
            font-weight: 800;
            letter-spacing: .16em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--line) !important;
            padding: .95rem 1.5rem;
        }

        .table-drive tbody td {
            border-bottom: 1px solid var(--line);
            padding: 1.05rem 1.5rem;
            vertical-align: middle;
            font-weight: 500;
            color: var(--txt);
        }

        .table-drive tbody tr:hover td {
            background: rgba(255, 255, 255, .035);
        }

        .table-drive tbody tr:last-child td {
            border-bottom: 0;
        }

        .text-muted-2 {
            color: var(--muted) !important;
        }

        .btn-ghost {
            border: 1px solid var(--line-strong);
            color: var(--txt);
            background: rgba(255, 255, 255, .03);
            font-weight: 700;
            border-radius: 999px !important;
            transition: .22s ease;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 8px 20px;
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, .09);
            color: #fff;
            border-color: rgba(255, 255, 255, .3);
        }

        .custom-select {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid var(--line-strong);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .custom-select:focus {
            box-shadow: none;
            border-color: #ffc107;
        }

        .custom-select option {
            background-color: var(--surface);
            color: #fff;
        }

    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-drive sticky-top">
    <div class="container-fluid px-4 px-lg-5">
        <a class="navbar-brand" th:href="@{/}">DRIVEON</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMainLogged">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMainLogged">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/users/profile}">
                        <i class="fa-solid fa-user me-1 text-warning"></i>
                        <span class="fw-bold" sec:authentication="name">Admin</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        <i class="fa-solid fa-warehouse me-1 brand-highlight"></i> My Garage
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/appointments/add}">
                        <i class="fa-solid fa-calendar-plus me-1 brand-highlight"></i> Book Service
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/vehicles/add}">
                        <i class="fa-solid fa-car me-1 brand-highlight"></i> Add Vehicle
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="btn btn-ghost-warning btn-sm px-3 py-2 mx-2" th:href="@{/admin/appointments}">
                        <i class="fa-solid fa-shield-halved me-1"></i> Admin
                    </a>
                </li>
                <li class="nav-item ms-lg-2">
                    <form th:action="@{/users/logout}" th:method="POST" class="m-0">
                        <button type="submit" class="btn btn-ghost-danger btn-sm px-3 py-2">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <a th:href="@{/admin/appointments}" class="btn-ghost">
            <i class="fa-solid fa-arrow-left me-2"></i> Manager Dashboard
        </a>
        <a th:href="@{/}" class="btn-ghost">
            Home <i class="fa-solid fa-arrow-right ms-2"></i>
        </a>
    </div>

    <div class="panel">
        <div class="panel-head">
            <h2><i class="fa-solid fa-users-gear"></i> User & Role Management</h2>
        </div>

        <div class="table-responsive">
            <table class="table table-drive align-middle">
                <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th class="text-center">Vehicles</th>
                    <th class="text-center">Appointments</th>
                    <th class="text-center">Loyalty Points</th>
                    <th>Role & Action</th>
                </tr>
                </thead>
                <tbody>

                <tr th:each="user : ${users}">
                    <td class="fw-bold text-white" th:text="${user.username}">user123</td>
                    <td class="text-muted-2" th:text="${user.email}">user@abv.bg</td>
                    <td class="text-center text-white" th:text="${user.vehiclesCount}">2</td>
                    <td class="text-center text-white" th:text="${user.appointmentsCount}">5</td>
                    <td class="text-center">
                        <span class="fw-bold text-warning" style="font-size: 1.1rem;">
                            <i class="fa-solid fa-star fa-sm me-1"></i>[[${user.loyaltyPoints}]]
                        </span>
                    </td>
                    <td>
                        <form th:action="@{/admin/users/change-role/{id}(id=${user.id})}" method="POST"
                              class="d-flex align-items-center mb-0 gap-2">
                            <select name="newRole" class="form-select custom-select" style="width: auto;">
                                <option value="USER" th:selected="${user.role == 'USER'}">USER</option>
                                <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
                            </select>
                            <button type="submit" class="btn btn-ghost-warning btn-sm px-3 py-1">Update</button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="6" class="text-center py-5 text-muted">No users found in the system.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
