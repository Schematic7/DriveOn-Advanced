<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - DriveOn Motors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;800;900&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --bg: #08090c;
            --line: rgba(255, 255, 255, .08);
            --line-strong: rgba(255, 255, 255, .16);
            --muted: #8b93a4;
            --brand: #e63946;
            --brand-2: #d90429;
            --txt: #eef1f6;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1c23;
            overflow-y: scroll;
        }

        .navbar-drive {
            background: rgba(8, 9, 12, .72);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--line);
            padding: .9rem 0;
        }

        .navbar-drive .navbar-brand {
            font-weight: 900;
            letter-spacing: .22em;
            font-size: 1.35rem;
            color: #fff !important;
            background: linear-gradient(90deg, #fff 40%, var(--brand));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar-drive .nav-link {
            color: var(--muted) !important;
            font-weight: 600;
            font-size: .86rem;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: .5rem .9rem !important;
            border-radius: 999px;
            transition: .22s ease;
        }

        .navbar-drive .nav-link:hover {
            color: #fff !important;
            background: rgba(255, 255, 255, .06);
        }

        .navbar-toggler-icon {
            filter: invert(1) grayscale(1);
        }

        .brand-highlight {
            color: var(--brand);
        }

        .btn-ghost-warning {
            border: 1px solid rgba(255, 193, 7, 0.4);
            color: #ffc107;
            background: rgba(255, 193, 7, 0.05);
            font-weight: 700;
            border-radius: 999px !important;
            transition: .22s ease;
        }

        .btn-ghost-warning:hover {
            background: rgba(255, 193, 7, 0.15);
            color: #fff;
            border-color: #ffc107;
        }

        .btn-ghost-danger {
            border: 1px solid rgba(230, 57, 70, 0.4);
            color: #e63946;
            background: rgba(230, 57, 70, 0.05);
            font-weight: 700;
            border-radius: 999px !important;
            transition: .22s ease;
        }

        .btn-ghost-danger:hover {
            background: rgba(230, 57, 70, 0.15);
            color: #fff;
            border-color: #e63946;
        }

        .dark-profile-panel {
            background-color: #1a1c23;
            color: #edf2f4;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 1.5rem 4rem 3rem 4rem;
            min-height: calc(100vh - 90px);
            box-shadow: 20px 0 50px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
        }

        .panel-header h2 {
            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: #ffffff;
            display: flex;
            align-items: center;
        }

        .form-label {
            font-size: 0.75rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .custom-input {
            background-color: #2b2d42;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 12px 15px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            background-color: #35394a;
            border-color: var(--brand);
            outline: none;
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.2);
            color: #ffffff;
        }

        .custom-input:read-only {
            background-color: #1a1c23;
            border-color: transparent;
            padding-left: 0;
            color: #a0a5b5;
        }

        .custom-input:read-only:focus {
            box-shadow: none;
        }

        .btn-brand {
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            color: white;
            border: none;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 20px;
            transition: all 0.25s ease;
            border-radius: 999px !important;
            box-shadow: 0 12px 30px -12px rgba(230, 57, 70, .8);
        }

        .btn-brand:hover {
            background-color: #d90429;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 18px 40px -14px rgba(230, 57, 70, .95);
        }

        .btn-ghost {
            border: 1px solid var(--line-strong);
            color: var(--txt);
            background: rgba(255, 255, 255, .03);
            font-weight: 700;
            border-radius: 999px !important;
            transition: .22s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 20px;
            text-decoration: none;
            text-align: center;
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, .09);
            color: #fff;
            border-color: rgba(255, 255, 255, .3);
        }

        .profile-image-container {
            background-image: linear-gradient(to right, rgba(26, 28, 35, 0.3) 0%, rgba(26, 28, 35, 0.7) 100%), url('/images/ProfileImg.png');
            background-size: cover;
            background-position: center;
            height: 100%;
            position: relative;
        }

        .image-overlay-text {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: white;
        }

        @media (max-width: 992px) {
            .dark-profile-panel {
                padding: 2rem;
                box-shadow: none;
            }

            .profile-image-container {
                display: none;
            }
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-drive sticky-top">
    <div class="container-fluid px-4 px-lg-5">
        <a class="navbar-brand" th:href="@{/}">DRIVEON</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMainLogged">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMainLogged">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/users/profile}">
                        <i class="fa-solid fa-user me-1 text-warning"></i>
                        <span class="fw-bold" th:text="${userProfile.username}">User</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        <i class="fa-solid fa-warehouse me-1 brand-highlight"></i> My Garage
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/appointments/add}">
                        <i class="fa-solid fa-calendar-plus me-1 brand-highlight"></i> Book Service
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/vehicles/add}">
                        <i class="fa-solid fa-car me-1 brand-highlight"></i> Add Vehicle
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="btn btn-ghost-warning btn-sm px-3 py-2 mx-2" th:href="@{/admin/appointments}">
                        <i class="fa-solid fa-shield-halved me-1"></i> Admin
                    </a>
                </li>
                <li class="nav-item ms-lg-2">
                    <form th:action="@{/users/logout}" th:method="POST" class="m-0">
                        <button type="submit" class="btn btn-ghost-danger btn-sm px-3 py-2">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid p-0">
    <div class="row g-0">

        <div class="col-lg-5 col-md-12">
            <div class="dark-profile-panel">

                <div class="panel-header mb-4 mt-2">
                    <h2>Edit Profile</h2>
                    <p class="text-white-50 mb-0">Update your personal contact information.</p>
                </div>

                <div class="section-title">
                    <i class="fa-solid fa-pen-to-square me-2 text-white-50"></i> Personal Info
                </div>

                <form th:action="@{/users/profile/edit}" th:method="POST" th:object="${userProfile}">

                    <div class="mb-3">
                        <label class="form-label">Email Address (Read Only)</label>
                        <input type="text" th:field="*{email}" class="form-control custom-input" readonly/>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Username (Read Only)</label>
                        <input type="text" th:field="*{username}" class="form-control custom-input" readonly/>
                    </div>

                    <div class="mb-3">
                        <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                        <input type="text" id="firstName" th:field="*{firstName}" class="form-control custom-input"/>
                        <small th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"
                               class="text-danger fw-bold d-block mt-1"></small>
                    </div>

                    <div class="mb-3">
                        <label for="lastName" class="form-label">Last Name <span class="text-danger">*</span></label>
                        <input type="text" id="lastName" th:field="*{lastName}" class="form-control custom-input"/>
                        <small th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"
                               class="text-danger fw-bold d-block mt-1"></small>
                    </div>

                    <div class="mb-4">
                        <label for="phoneNumber" class="form-label">Phone Number <span
                                class="text-danger">*</span></label>
                        <input type="text" id="phoneNumber" th:field="*{phoneNumber}"
                               class="form-control custom-input"/>
                        <small th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"
                               class="text-danger fw-bold d-block mt-1"></small>
                    </div>

                    <div class="d-flex gap-3 mt-2 mb-4">
                        <button type="submit" class="btn btn-brand flex-grow-1">Save Changes</button>
                        <a th:href="@{/users/profile}" class="btn btn-ghost flex-grow-1">Cancel</a>
                    </div>
                </form>

            </div>
        </div>

        <div class="col-lg-7 d-none d-lg-block p-0">
            <div class="profile-image-container">
                <div class="image-overlay-text">
                    <h3 class="fw-bold mb-1 text-white">Your Trusted Partner.</h3>
                    <p class="mb-0 text-white-50">Keeping you safe on the road since 2026.</p>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
